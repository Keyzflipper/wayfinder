<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wayfinder — Offline</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #16302C;
    color: #EDE6D6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
  }
  .wrap {
    max-width: 22rem;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-family: Georgia, 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 0.75rem;
  }
  p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: #7A9186;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>No connection</h1>
    <p>
      Wayfinder needs a connection to identify what's in front of you and
      look up what's nearby. Once you're back online, this'll pick up
      right where it left off.
    </p>
  </div>
</body>
</html>
