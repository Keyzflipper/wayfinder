name = "wayfinder-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ============================================================
# Static assets — serves the PWA (../frontend) from this same Worker/
# origin, which is why frontend/src/main.js can call the API via the
# relative path "/api" instead of a separate cross-origin URL.
# Requests that don't match a file here (every /api/* route) fall
# through to the fetch handler in src/index.ts automatically — no
# routing changes needed there.
# ============================================================
[assets]
directory = "../frontend"

# ============================================================
# D1 — structured data (trips, saved_finds, guide_chunks)
# `binding` name (DB) must match the Env interface in src/types/index.ts.
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "wayfinder-db"
database_id = "83f8e45f-d3d9-43cc-9790-9c22d6cb222c"

# ============================================================
# R2 — captured shutter photos. The old GUIDES bucket (uploaded
# PDF/EPUB guides) is gone along with file-based guide upload — guides are
# plain pasted text now, stored directly in D1's guide_chunks, no binary
# storage needed. The wayfinder-guides bucket itself and its now-orphaned
# objects were left alone rather than deleted — real infra deletion wasn't
# part of this change; delete it manually via the dashboard if you want it gone.
# ============================================================
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wayfinder-photos"

# ============================================================
# Non-secret config. Safe to commit.
# Secrets (ANTHROPIC_API_KEY, MAPBOX_TOKEN) are NOT here — set
# via `wrangler secret put <NAME>` (prod) or `.dev.vars` (local),
# and they land in the same Env interface at runtime without ever
# touching this file.
#
# CLOUDFLARE_ACCOUNT_ID and AI_GATEWAY_ID are plain vars, not
# secrets — they're routing identifiers (which gateway to call),
# not credentials. The actual credential (ANTHROPIC_API_KEY) still
# travels as a secret on each request.
# ============================================================
[vars]
ENVIRONMENT = "development"
MAX_PHOTO_UPLOAD_BYTES = "8388608"  # 8 MB cap on a single capture
CLOUDFLARE_ACCOUNT_ID = "946b6f72ba4124bb4d0ba7a1c9c6ea49"
AI_GATEWAY_ID = "wayfinder-gateway"

# ============================================================
# Local dev server
# ============================================================
[dev]
port = 8787
